name: Labelling app tests

# The suite that guards this app is a Playwright one, and until now nothing ran
# it. Every contract it holds was learned from a fault in production -- the
# annotation key, the blinding, the identity gate, the chip bake falling back,
# the ramp agreeing between Python and JavaScript -- and a test nobody runs is a
# comment. It is scoped to the three modules that need no scientific stack, so
# it installs in under a minute and is worth blocking a merge on.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/label_cell.py'
      - 'src/label_rounds.py'
      - 'src/build_label_batches.py'
      - 'src/build_batch_chips.py'
      - 'src/build_batch_dense.py'
      - 'src/build_batch_evidence.py'
      - 'tests/test_label_app.py'
      - 'tests/test_label_cell.py'
      - 'tests/test_label_rounds.py'
      - 'tests/test_chip_ramp.py'
      - 'tests/test_label_batches.py'
      - 'tests/test_label_overlap.py'
      - 'src/reassign_batches.py'
      - '.github/workflows/tests.yml'
      # The job calls this now, so a change to it has to be able to break
      # the job it is supposed to guard.
      - 'tools/check_app_html.py'
      # A rule change here changes what passes; run the suite for it.
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'app/**'
      - 'src/label_cell.py'
      - 'src/label_rounds.py'
      - 'src/build_label_batches.py'
      - 'src/build_batch_chips.py'
      - 'src/build_batch_dense.py'
      - 'src/build_batch_evidence.py'
      - 'tests/test_label_app.py'
      - 'tests/test_label_cell.py'
      - 'tests/test_label_rounds.py'
      - 'tests/test_chip_ramp.py'
      - 'tests/test_label_batches.py'
      - 'tests/test_label_overlap.py'
      - 'src/reassign_batches.py'
      - '.github/workflows/tests.yml'
      # The job calls this now, so a change to it has to be able to break
      # the job it is supposed to guard.
      - 'tools/check_app_html.py'
      # A rule change here changes what passes; run the suite for it.
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # This repository is PUBLIC, and the line is drawn by one question: does
      # every browser that opens the app already have this value?
      #
      # `sheetUrl` and `submitToken` do, so they are committed on purpose
      # (2026-09-04) and this step no longer refuses them -- the page downloads
      # config.js, the /exec endpoint has only the powers Code.gs grants it, and
      # the token is anti-spam rather than authentication. What no browser ever
      # sees is the Earth Engine service-account PRIVATE KEY: the SDK refuses a
      # browser-side private key, which is why Code.gs brokers a token instead,
      # and it must never reach a commit in any file. `.githooks/pre-commit`
      # catches that on the machine that holds the key; this catches it
      # everywhere else.
      - name: No private key is committed
        run: |
          fail=0
          # Assembled from pieces so the pattern does not match this file.
          key_re='BEGIN [A-Z ]*PRIVATE'' KEY|"private''_key"'
          if git grep -nE "$key_re" -- \
               ':!tests/*' ':!app/apps_script/Code.gs' ':!.githooks/*' \
               ':!.github/workflows/*' \
               >/dev/null 2>&1; then
            echo "::error::a private key is committed to this repository"
            fail=1
          fi
          # A config that does not parse deploys as "unconfigured" rather than
          # as broken -- the same silent failure the Pages build checks for.
          node --check app/config.js || fail=1
          exit $fail

      # uv, not setup-python: the suite's dependencies are resolved in uv.lock
      # and `--locked` below refuses to run if pyproject.toml has moved without
      # a relock. `--python 3.12` is what uv installs to satisfy them.
      # An EXACT tag: setup-uv stopped publishing a floating major tag
      # after v7, so `@v10` is not a ref and the job dies in the
      # "Set up job" step, before anything it guards has run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `test_chip_ramp.py` runs the app's own `comboBounds()` in node against
      # the baker's `combo_bounds()`. It SKIPS cleanly where node is missing, so
      # without this the job would go green having checked nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # This list used to be written out here by hand, unpinned, and drifted
      # from pyproject.toml -- which is how the suite twice went green having
      # collected nothing (pillow) or failed test by test (pyproj). It now
      # lives in the `app-tests` dependency group, and the reason each package
      # is in it is recorded there.
      #
      # `--only-group` installs the group WITHOUT this project or its
      # dependencies, which is what keeps the install under a minute: the five
      # modules this suite covers need no scientific stack. `--locked` fails
      # the job if uv.lock does not already satisfy pyproject.toml, so the
      # environment CI tests is the one the lockfile describes.
      - name: Install
        run: |
          uv sync --only-group app-tests --locked --python 3.12
          uv run --no-sync playwright install --with-deps chromium

      # Both of these checks live in tools/check_app_html.py, which pre-commit
      # runs on the commit that breaks them. They used to be heredocs here,
      # which meant they ran only after a push and could only be fixed by
      # editing YAML -- and there was nothing keeping the local and CI versions
      # the same, because there was no local version.
      - name: Check app/label_app.html
        run: python3 tools/check_app_html.py

      # The browser fixtures SKIP rather than fail when chromium is missing,
      # which is right on a bare checkout and wrong here: a job that skipped
      # everything must not report success. One run, then read its summary --
      # re-running the suite to check it would double the job.
      - name: Test
        run: |
          set -o pipefail
          # test_label_cell.py is the guard on what a label MEANS: it runs
          # the app's own `s2Cell()` in node against `src/label_cell.py`, and
          # the two disagreeing means the interpreter judges one footprint
          # while the builders reduce over another. It was written and then
          # not listed here, which is the state the header calls a comment.
          uv run --no-sync pytest \
                 tests/test_label_app.py tests/test_chip_ramp.py \
                 tests/test_label_cell.py tests/test_label_rounds.py \
                 tests/test_label_batches.py tests/test_label_overlap.py \
                 -q --tb=short | tee result.txt
          # ZERO skips is the invariant, and the old check was weaker than it
          # looks: `^[0-9]+ skipped` only matches a summary that BEGINS with the
          # skip count, i.e. a suite that skipped entirely. A PARTIAL skip
          # passes it. That is not hypothetical -- syncing this group into a
          # clean environment and forgetting the browser gives
          # "57 passed, 85 skipped", which begins with "57 passed", so the job
          # goes green with 85 of the 142 tests never run. Every one of those
          # is a browser test, which is to say the whole labelling loop.
          if grep -qE '[0-9]+ skipped' result.txt; then
            echo "::error::tests were skipped -- chromium or node did not install"
            exit 1
          fi
